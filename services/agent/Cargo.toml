[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
rig-core = "0.35"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
walkdir = "2"
schemars = "1"
tower-http = { version = "0.6", features = ["cors"] }
openssl = { version = "0.10", features = ["vendored"] }
